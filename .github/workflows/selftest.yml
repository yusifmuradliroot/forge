name: selftest
on: [push, pull_request]
jobs:
  battery:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: python3 tools/check.py
      - run: node tests/check_runner.js
      - run: bash tests/selftest.sh
