[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "forge-js"
version = "2.12.0"
description = "Minimal JS protection layer: raw JS in, encrypted .fs data out"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"
keywords = ["javascript", "obfuscation", "build-tools", "compiler"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Build Tools",
  "Topic :: Security",
]

[tool.setuptools]
py-modules = []
